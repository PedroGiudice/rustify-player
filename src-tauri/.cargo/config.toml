# Android 15+ (16 KB page size): o .so precisa de segmentos LOAD alinhados a
# 16 KB, senão o sistema exibe warning de compatibilidade (e bloqueia em
# devices 16 KB futuros). https://developer.android.com/16kb-page-size
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.i686-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
