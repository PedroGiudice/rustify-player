[workspace]
members = [".", "crates/audio-engine", "crates/library-indexer", "crates/slskd-client"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.78"
authors = ["PedroGiudice"]
license = "MIT"

[workspace.dependencies]
# Audio stack
symphonia = { version = "0.5.4", default-features = false, features = ["flac"] }
pipewire = "0.9"
libspa = "0.9"
rtrb = "0.3"
rustfft = "6"
bytemuck = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
gstreamer = { version = "0.25", features = ["v1_20"] }
gstreamer-play = { version = "0.25", features = ["v1_22"] }
gstreamer-audio = "0.25"

# Foundational
thiserror = "2"
# feature "log": sem subscriber de tracing instalado no binario do app, todo
# `tracing::info!/warn!` do library-indexer e do audio-engine caia no vazio —
# o backfill de letras, as falhas de embed e o diagnostico do scan eram
# invisiveis (log do app: 624 bytes, zero mencao ao pipeline). Com a feature,
# cada evento vira um record do facade `log`, que o tauri-plugin-log ja roteia
# pra stdout + webview + ~/.local/share/dev.cmr.rustifyplayer/logs/.
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Library indexer stack
walkdir = "2"
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }
ebur128 = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rubato = "0.15"
sha1 = "0.10"
sha2 = "0.10"
unicode-normalization = "0.1"
strsim = "0.11"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
zstd = { version = "0.13", default-features = false }
tempfile = "3"

[package]
name = "rustify-player"
version = "0.2.13"
description = "Player de musica audiofilo - Tauri shell"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
name = "rustify_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-log = { version = "2", features = ["colored"] }
log = "0.4"
serde = { workspace = true }
serde_json = "1"
tracing-subscriber = { workspace = true }
library-indexer = { path = "crates/library-indexer" }
slskd-client = { path = "crates/slskd-client" }
audio-engine = { path = "crates/audio-engine", features = ["serde"] }
tauri-plugin-fs = "2.5.0"
tauri-plugin-dialog = "2"
tauri-plugin-mcp-bridge = "0.11.1"
souvlaki = { version = "0.7", default-features = false, features = ["use_zbus"] }
crossbeam-channel = { workspace = true }
tracing = { workspace = true }
ureq = { workspace = true }
serde_yaml = "0.9"
notify = { workspace = true }
walkdir = { workspace = true }
symphonia = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
