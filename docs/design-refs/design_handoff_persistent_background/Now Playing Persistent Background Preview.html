<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Rustify — Persistent Background Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Tokens (subset do extractor-lab.css) ───────────────────── */
:root {
  --bg-canvas:   #fafafa;
  --bg-paper:    #ffffff;
  --bg-soft:     #f7f6f3;
  --bg-tint:     #f5f5f5;
  --bg-faint:    #f4f4f4;
  --fg-1: #171717; --fg-2: #262626; --fg-3: #404040; --fg-4: #525252;
  --fg-5: #737373; --fg-6: #767676; --fg-7: #b0b0b0; --fg-8: #d4d4d4;
  --line-1: #ececec; --line-2: #e5e5e5; --line-3: #ebebeb;
  --blue-ring:#3b82f6; --blue-bg:#eff6ff; --blue-fg:#2563eb;
  --green-ring:#10b981;

  --tone-lavender-bg:#f1eefa; --tone-lavender-border:#e7e2f4;
  --tone-mint-bg:    #e8f5ee; --tone-mint-border:    #dcefe2;
  --tone-peach-bg:   #fbf1e6; --tone-peach-border:   #f4e7d6;
  --tone-sky-bg:     #e9f0fa; --tone-sky-border:     #dde6f3;
  --tone-rose-bg:    #fbeef0; --tone-rose-border:    #f4e3e6;
  --tone-butter-bg:  #faf4dd; --tone-butter-border:  #f1ead0;
  --tone-paper-bg:   #f4f4f4; --tone-paper-border:   #e9e9e9;

  --font-sans: 'Instrument Sans', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'Menlo', 'Consolas', monospace;

  --radius-xs: 4px; --radius-sm: 5px; --radius-md: 8px;
  --radius-lg: 10px; --radius-xl: 12px; --radius-2xl: 14px;
  --radius-pill: 999px;

  --shadow-hairline: 0 1px 0 rgba(0,0,0,0.02);
  --shadow-card:     0 1px 4px rgba(0,0,0,0.04);
  --shadow-hover:    0 8px 24px rgba(0,0,0,0.06);
  --shadow-compact:  0 6px 18px rgba(0,0,0,0.05);

  --ease-out: cubic-bezier(0.4, 0, 0.2, 1);
  --dur-base: 0.15s;
  --dur-med:  0.18s;

  --sidebar-w:   220px;
  --playerbar-h: 72px;
  --titlebar-h:  32px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg-canvas); color: var(--fg-1);
  font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ── App shell ──────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--titlebar-h) 1fr var(--playerbar-h);
  height: 100vh;
  position: relative;
  isolation: isolate;
}
.titlebar  { grid-row: 1; grid-column: 1 / 3; }
.sidebar   { grid-row: 2 / 4; grid-column: 1; }
.main      { grid-row: 2; grid-column: 2; min-width: 0; min-height: 0; position: relative; overflow: hidden; background: transparent; }
.playerbar { grid-row: 3; grid-column: 2; }

/* ── GLOBAL ANIMATED BACKGROUND (a estrela do show) ─────────── */
.app-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  transition:
    opacity 420ms var(--ease-out),
    filter  420ms var(--ease-out);
}
.app-bg__canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%; display: block;
}
.app-bg[data-mode="focused"] { opacity: 1; filter: none; }
.app-bg[data-mode="ambient"] {
  opacity: 0.80;
  filter: blur(8px) saturate(0.9);
}

/* ── Titlebar ───────────────────────────────────────────────── */
.titlebar {
  display: flex; align-items: center; gap: 10px;
  height: var(--titlebar-h);
  background: var(--bg-paper);
  border-bottom: 1px solid var(--line-2);
  padding: 0 12px; user-select: none;
  color: var(--fg-3); font-size: 12px;
  position: relative; z-index: 2;
}
.tl-lights { display: inline-flex; gap: 6px; }
.tl-dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.18); }
.tl-dot.r { background: #ff5f57; } .tl-dot.y { background: #ffbd2e; } .tl-dot.g { background: #28c940; }
.titlebar__spacer { flex: 1; height: 100%; }
.titlebar__text { font-weight: 500; color: var(--fg-2); letter-spacing: -0.01em; }
.titlebar__dim { color: var(--fg-6); font-weight: 400; }

/* ── Sidebar ────────────────────────────────────────────────── */
.sidebar {
  background: var(--bg-paper);
  border-right: 1px solid var(--line-2);
  display: flex; flex-direction: column; gap: 18px;
  padding: 18px 10px 12px;
  position: relative; z-index: 2;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px; }
.brand__mark {
  width: 22px; height: 22px; display: grid; place-items: center;
  color: var(--fg-1);
}
.brand__word { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: var(--fg-1); }
.brand__dot { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--green-ring); }

.sidebar__section { display: flex; flex-direction: column; gap: 1px; }
.sidebar__label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  color: var(--fg-5); text-transform: uppercase; padding: 0 12px 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 7px 12px; border-radius: var(--radius-md);
  color: var(--fg-3); font-size: 13.5px; font-weight: 500;
  cursor: pointer;
  transition: background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
}
.nav-item:hover { background: var(--bg-soft); color: var(--fg-1); }
.nav-item.active { background: var(--bg-faint); color: var(--fg-1); font-weight: 600; }
.nav-item svg { width: 16px; height: 16px; flex: none; opacity: 0.85; }
.nav-item__kbd {
  margin-left: auto;
  font-family: var(--font-mono); font-size: 10px;
  color: var(--fg-6); background: var(--bg-paper);
  border: 1px solid var(--line-2);
  padding: 1px 6px; border-radius: 4px;
}
.sidebar__spacer { flex: 1; }
.sidebar__footer {
  display: flex; flex-direction: column; gap: 1px;
  padding-top: 12px; border-top: 1px solid var(--line-2);
}

/* ── Main / generic views ──────────────────────────────────── */
.view { height: 100%; overflow: auto; animation: fade-in 0.25s var(--ease-out); }
@keyframes fade-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}
.view__head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 28px 40px 18px;
  border-bottom: 1px solid var(--line-2);
  gap: 32px;
  background: var(--bg-paper);
}
.view__head h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; color: var(--fg-1); margin: 0; }
.view__head-hint { font-size: 13px; color: var(--fg-5); margin: 4px 0 0; }
.view__stats {
  display: flex; align-items: center; gap: 14px;
  font-family: var(--font-mono); font-size: 11.5px;
  color: var(--fg-5); font-variant-numeric: tabular-nums;
}
.view__stats > span + span::before {
  content: '·'; display: inline-block; margin-right: 14px; color: var(--fg-7);
}
.view__stats b { font-weight: 600; color: var(--fg-2); }
.view__body { padding: 28px 40px 56px; display: flex; flex-direction: column; gap: 36px; }

.section__head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; gap: 16px; }
.section__title {
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--fg-5); margin: 0;
}

.hero-grid { display: grid; grid-template-columns: 1.8fr 1fr 1fr; gap: 10px; }
.hero-tile {
  background: var(--bg-paper);
  border: 1px solid var(--line-2);
  border-radius: var(--radius-xl);
  padding: 16px 18px 14px;
  display: flex; flex-direction: column; gap: 6px;
  min-height: 112px; cursor: pointer;
  transition: border-color var(--dur-base), box-shadow var(--dur-base);
}
.hero-tile:hover { border-color: var(--fg-8); box-shadow: var(--shadow-hairline); }
.hero-tile--feature { background: var(--bg-soft); min-height: 160px; }
.hero-tile__eyebrow {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--fg-5); display: flex; align-items: center; gap: 7px;
}
.hero-tile__eyebrow .dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--blue-ring);
  box-shadow: 0 0 0 4px rgba(59,130,246,0.08);
}
.hero-tile__title { font-size: 18px; font-weight: 600; letter-spacing: -0.015em; color: var(--fg-1); margin: 4px 0 0; }
.hero-tile__sub { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-5); margin-top: auto; }

.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 22px 16px; }
.card { cursor: pointer; }
.card__cover {
  aspect-ratio: 1; margin-bottom: 12px;
  border-radius: var(--radius-2xl); border: 1px solid var(--line-2);
  transition: transform var(--dur-med), box-shadow var(--dur-med);
}
.card:hover .card__cover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.card__title { font-size: 13.5px; font-weight: 600; color: var(--fg-1); margin: 0 0 2px; }
.card__sub { font-size: 12px; color: var(--fg-5); }
.tone-lavender { background: var(--tone-lavender-bg); border-color: var(--tone-lavender-border); }
.tone-mint     { background: var(--tone-mint-bg);     border-color: var(--tone-mint-border); }
.tone-peach    { background: var(--tone-peach-bg);    border-color: var(--tone-peach-border); }
.tone-sky      { background: var(--tone-sky-bg);      border-color: var(--tone-sky-border); }
.tone-rose     { background: var(--tone-rose-bg);     border-color: var(--tone-rose-border); }
.tone-butter   { background: var(--tone-butter-bg);   border-color: var(--tone-butter-border); }
.tone-paper    { background: var(--tone-paper-bg);    border-color: var(--tone-paper-border); }

/* ── Now Playing ────────────────────────────────────────────── */
.np {
  position: relative; height: 100%; overflow: hidden;
  background: transparent; /* deixa o app-bg vazar */
}
.np__chrome {
  position: relative; z-index: 1;
  height: 100%;
  padding: 32px 40px;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 24px;
  align-content: start;
}
.np__left {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 28px;
  align-items: end;
  max-width: 880px;
}
.np__cover {
  width: 200px; height: 200px;
  border-radius: var(--radius-2xl);
  position: relative; overflow: hidden;
  background: var(--bg-paper);
  border: 1px solid var(--line-2);
  box-shadow: var(--shadow-compact);
  display: grid; place-items: center;
}
.np__cover img { width: 72%; height: 72%; object-fit: contain; opacity: 0.85; }
.np__cover .badge-fmt {
  position: absolute; top: 10px; left: 10px;
  font-family: var(--font-mono); font-size: 10px;
  color: var(--fg-5);
  background: var(--bg-paper);
  border: 1px solid var(--line-2);
  padding: 2px 7px; border-radius: var(--radius-xs);
}
.np__tags { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.np__tag-playing {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--blue-bg); color: var(--blue-fg);
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 4px 9px 4px 8px; border-radius: var(--radius-pill);
  line-height: 1;
}
.np__tag-playing .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--blue-ring);
  box-shadow: 0 0 0 4px rgba(59,130,246,0.14);
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
.np__tag-source { font-family: var(--font-mono); font-size: 11px; color: var(--fg-5); }
.np__tag-source b { color: var(--fg-2); font-weight: 600; }
.np__title {
  font-size: clamp(48px, 5.4vw, 76px);
  font-weight: 600; line-height: 0.98;
  letter-spacing: -0.025em; color: var(--fg-1);
  margin: 0 0 8px; text-wrap: balance;
}
.np__artist { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; color: var(--fg-2); margin: 0 0 2px; cursor: pointer; }
.np__album  { font-family: var(--font-mono); font-size: 12px; color: var(--fg-5); margin: 0 0 22px; cursor: pointer; }
.np__specs {
  display: flex; align-items: center; flex-wrap: wrap;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--fg-4); line-height: 1.8;
}
.np__specs > span + span::before {
  content: ''; display: inline-block; width: 3px; height: 3px;
  border-radius: 50%; background: var(--fg-7); margin: 0 12px;
}
.np__specs b { font-weight: 600; color: var(--fg-2); }
.np__specs--line2 { margin-top: 2px; color: var(--fg-5); }

.np__viz-nav {
  position: absolute; bottom: 24px; right: 28px;
  z-index: 3; display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
}
.np__nav-row { display: flex; gap: 6px; align-items: center; }
.np__nav-btn {
  width: 28px; height: 28px; border-radius: var(--radius-md);
  display: grid; place-items: center;
  color: var(--fg-5); background: var(--bg-paper);
  border: 1px solid var(--line-2);
}
.np__nav-btn:hover { background: var(--bg-soft); color: var(--fg-1); border-color: var(--fg-8); }
.np__nav-btn svg { width: 14px; height: 14px; }
.np__nav-name {
  min-width: 152px; text-align: center;
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 500;
  letter-spacing: 0.04em; color: var(--fg-5); text-transform: uppercase;
  padding: 5px 10px; background: var(--bg-paper);
  border: 1px solid var(--line-2); border-radius: var(--radius-md);
  cursor: pointer;
}
.np__nav-name b { color: var(--fg-1); font-weight: 600; }

/* ── Player bar ─────────────────────────────────────────────── */
.playerbar {
  background: var(--bg-paper);
  border-top: 1px solid var(--line-2);
  display: grid;
  grid-template-columns: minmax(240px, 1fr) 1.4fr minmax(240px, 1fr);
  align-items: center;
  padding: 0 16px; gap: 24px;
  position: relative; z-index: 2;
}
.pb-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.pb-cover { width: 44px; height: 44px; border-radius: var(--radius-md); background: var(--tone-mint-bg); border: 1px solid var(--tone-mint-border); }
.pb-meta { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.pb-title { font-size: 13px; font-weight: 600; color: var(--fg-1); }
.pb-artist { font-size: 12px; color: var(--fg-5); }

.pb-icon-btn {
  width: 28px; height: 28px; border-radius: var(--radius-md);
  display: grid; place-items: center;
  color: var(--fg-5);
  transition: color var(--dur-base), background var(--dur-base);
}
.pb-icon-btn:hover { color: var(--fg-1); background: var(--bg-soft); }
.pb-icon-btn svg { width: 14px; height: 14px; }

.pb-center { display: flex; flex-direction: column; gap: 6px; padding: 8px 0; }
.pb-transport { display: flex; align-items: center; justify-content: center; gap: 4px; }
.pb-btn--primary {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--fg-1); color: #fff;
  margin: 0 6px;
  display: grid; place-items: center;
  transition: transform var(--dur-base), background var(--dur-base);
}
.pb-btn--primary:hover { background: var(--fg-2); transform: scale(1.04); }
.pb-btn--primary svg { width: 16px; height: 16px; }

.pb-seek { display: grid; grid-template-columns: 42px 1fr 42px; gap: 10px; align-items: center; }
.pb-time { font-family: var(--font-mono); font-size: 11px; color: var(--fg-5); text-align: center; }
.progress { height: 3px; background: var(--line-2); border-radius: 999px; position: relative; }
.progress__fill { height: 100%; background: var(--fg-3); border-radius: inherit; width: 32%; }

.pb-right { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.pb-tech {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px; border: 1px solid var(--line-2);
  border-radius: var(--radius-md);
  font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-4);
}
.pb-tech__sep { color: var(--fg-7); }
.pb-tech__dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green-ring); box-shadow: 0 0 0 3px rgba(16,185,129,0.16); }

/* ── Reactivity HUD (canto, mostra o que o user pediu pra ver) ── */
.reactivity-hud {
  position: fixed; bottom: 88px; right: 16px;
  background: var(--bg-paper);
  border: 1px solid var(--line-2);
  border-radius: var(--radius-lg);
  padding: 10px 12px;
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--fg-5);
  display: flex; flex-direction: column; gap: 6px;
  box-shadow: var(--shadow-card);
  z-index: 50; min-width: 220px;
  pointer-events: none;
}
.reactivity-hud b { color: var(--fg-1); font-weight: 600; }
.reactivity-hud__row { display: flex; justify-content: space-between; gap: 12px; }
.reactivity-hud__label {
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--fg-6);
  border-bottom: 1px solid var(--line-3);
  padding-bottom: 4px; margin-bottom: 2px;
}
.reactivity-hud__pill {
  display: inline-block; padding: 1px 6px;
  border-radius: var(--radius-pill);
  background: var(--bg-soft); border: 1px solid var(--line-2);
  color: var(--fg-2);
}
.reactivity-hud__pill--focused { background: var(--blue-bg); border-color: rgba(59,130,246,0.3); color: var(--blue-fg); }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- Background global — UMA instância pro app inteiro. -->
  <div class="app-bg" id="appBg" data-mode="ambient" aria-hidden="true">
    <canvas class="app-bg__canvas" id="bgCanvas"></canvas>
  </div>

  <!-- Titlebar -->
  <header class="titlebar">
    <span class="tl-lights"><span class="tl-dot r"></span><span class="tl-dot y"></span><span class="tl-dot g"></span></span>
    <span class="titlebar__text">Rustify <span class="titlebar__dim">— preview do bg persistente</span></span>
    <span class="titlebar__spacer"></span>
    <span class="mono" style="color: var(--fg-6); font-size: 10.5px;" id="routeLabel">/home</span>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand__mark">
        <svg viewBox="0 0 22 22" width="20" height="20" fill="currentColor">
          <rect x="3" y="4" width="3" height="14"/>
          <rect x="8" y="7" width="3" height="11"/>
          <rect x="13" y="10" width="3" height="8"/>
          <rect x="18" y="13" width="2" height="5"/>
        </svg>
      </span>
      <span class="brand__word">Rustify</span>
      <span class="brand__dot"></span>
    </div>
    <div class="sidebar__section">
      <div class="sidebar__label">Discover</div>
      <button class="nav-item" data-route="/home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 12 3l9 6"/><path d="M5 9v11h14V9"/></svg>
        Home
        <span class="nav-item__kbd">H</span>
      </button>
      <button class="nav-item" data-route="/library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h4v16H3z"/><path d="M9 4h4v16H9z"/><path d="m15 5 4 1-3 14-4-1z"/></svg>
        Library
        <span class="nav-item__kbd">L</span>
      </button>
      <button class="nav-item" data-route="/albums">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
        Albums
      </button>
    </div>
    <div class="sidebar__section">
      <div class="sidebar__label">Listening</div>
      <button class="nav-item" data-route="/now-playing">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>
        Now Playing
        <span class="nav-item__kbd">N</span>
      </button>
      <button class="nav-item" data-route="/queue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h13"/><path d="M3 12h13"/><path d="M3 18h9"/><circle cx="18" cy="18" r="3"/></svg>
        Queue
      </button>
    </div>
    <div class="sidebar__spacer"></div>

<script>
/* ────────────────────────────────────────────────────────────
   shapes.ts — copiadas 1:1 do repo + novas variações
   ──────────────────────────────────────────────────────────── */
const SHAPES = [
  { name: "cordillera", fn: (u, v, t) => {
      const cx = 0.5 + Math.sin(t * 0.18) * 0.04;
      const du = u - cx, dv = v - 0.5;
      return Math.exp(-(du * du * 26 + dv * dv * 1.6));
  }},
  { name: "nebula", fn: (u, v, t) => {
      const cx = 0.5 + Math.sin(t * 0.13) * 0.07;
      const cy = 0.5 + Math.cos(t * 0.10) * 0.04;
      const du = u - cx, dv = v - cy;
      return Math.exp(-(du * du * 5 + dv * dv * 4));
  }},
  { name: "horizon", fn: (u, v, t) => {
      const dv = v - 0.5;
      const ripple = 0.7 + 0.3 * Math.sin(u * Math.PI * 4 + t * 0.4);
      return Math.exp(-(dv * dv * 12)) * ripple;
  }},
  { name: "twin peaks", fn: (u, v, t) => {
      const dv = v - 0.5;
      const drift = Math.sin(t * 0.22) * 0.025;
      const a = u - (0.34 + drift);
      const b = u - (0.66 - drift);
      return Math.max(
        Math.exp(-(a * a * 52 + dv * dv * 2.0)),
        Math.exp(-(b * b * 52 + dv * dv * 2.0)),
      );
  }},
  { name: "vortex", fn: (u, v, t) => {
      const du = u - 0.5, dv = v - 0.5;
      const r = Math.sqrt(du * du + dv * dv);
      const theta = Math.atan2(dv, du);
      const spiral = Math.sin(theta * 3 + r * 16 - t * 1.0);
      return Math.exp(-r * r * 5) * (0.55 + 0.45 * spiral);
  }},
  { name: "ember", fn: (u, v, t) => {
      const cx = 0.5 + Math.sin(t * 0.4) * 0.025;
      const widthK = 6 + v * 22;
      const du = u - cx;
      const env = Math.exp(-Math.pow(v - 0.62, 2) * 5);
      const flicker = 0.86 + 0.14 * Math.sin(t * 4.5 + v * 9);
      return Math.exp(-du * du * widthK) * env * flicker;
  }},
  { name: "wavefront", fn: (u, v, t) => {
      const angle = (u * 1.6 - v * 0.8) + t * 0.18;
      const wave = Math.sin(angle * Math.PI * 2);
      const env = 1 - Math.abs(v - 0.5) * 1.3;
      return Math.max(0, wave) * Math.max(0, env) * 0.9;
  }},
  { name: "aurora", fn: (u, v, t) => {
      const curtain = Math.sin(u * Math.PI * 5 + Math.sin(t * 0.3) * 2);
      const band = Math.exp(-Math.pow(v - 0.42, 2) * 6);
      return band * (0.55 + 0.45 * curtain);
  }},
  { name: "ripple", fn: (u, v, t) => {
      const cx = 0.5 + Math.sin(t * 0.25) * 0.12;
      const cy = 0.5 + Math.cos(t * 0.20) * 0.08;
      const r = Math.sqrt((u - cx) * (u - cx) + (v - cy) * (v - cy));
      return Math.exp(-r * r * 4) * (0.5 + 0.5 * Math.sin(r * 34 - t * 2.2));
  }},
  { name: "dunes", fn: (u, v, t) => {
      const ridge = Math.sin(u * Math.PI * 2.2 + t * 0.2) * 0.12;
      const dv = v - (0.55 + ridge);
      return Math.exp(-dv * dv * 22) + 0.35 * Math.exp(-Math.pow(v - 0.3 - ridge * 0.5, 2) * 30);
  }},
  { name: "lattice", fn: (u, v, t) => {
      const a = Math.sin(u * Math.PI * 6 + t * 0.4);
      const b = Math.sin(v * Math.PI * 6 - t * 0.3);
      return Math.max(0, a * b) * 0.9;
  }},
  { name: "comet", fn: (u, v, t) => {
      const cx = (t * 0.16) % 1.3 - 0.15;
      const cy = 0.5 + Math.sin(t * 0.5) * 0.12;
      const du = u - cx, dv = v - cy;
      const tail = du > 0 ? Math.exp(-du * 5) : Math.exp(du * 40);
      return Math.exp(-dv * dv * 40) * tail;
  }},
  { name: "tide", fn: (u, v, t) => {
      const level = 0.5 + Math.sin(t * 0.3) * 0.18;
      const swell = Math.sin(u * Math.PI * 3 + t * 0.6) * 0.04;
      const dv = v - (level + swell);
      return Math.exp(-dv * dv * 10);
  }},
  // ── família radial / propagante (no espírito da "ripple") ──
  { name: "sonar", fn: (u, v, t) => {
      const r = Math.sqrt((u - 0.5) * (u - 0.5) + (v - 0.5) * (v - 0.5));
      const ph = (t * 0.35) % 1;              // raio do anel: cresce 0→1 e reseta
      const ring = Math.exp(-Math.pow((r - ph * 0.9) * 10, 2));
      return ring * (1 - ph);                 // desbota conforme expande
  }},
  { name: "pond", fn: (u, v, t) => {
      const s1x = 0.35 + Math.sin(t * 0.20) * 0.05, s1y = 0.40;
      const s2x = 0.65, s2y = 0.60 + Math.cos(t * 0.17) * 0.05;
      const r1 = Math.sqrt((u - s1x) * (u - s1x) + (v - s1y) * (v - s1y));
      const r2 = Math.sqrt((u - s2x) * (u - s2x) + (v - s2y) * (v - s2y));
      const w1 = Math.exp(-r1 * r1 * 3) * Math.sin(r1 * 40 - t * 2.4);
      const w2 = Math.exp(-r2 * r2 * 3) * Math.sin(r2 * 40 - t * 2.0);
      return Math.max(0, w1 + w2);            // duas gotas interferindo
  }},
  { name: "whirlpool", fn: (u, v, t) => {
      const du = u - 0.5, dv = v - 0.5;
      const r = Math.sqrt(du * du + dv * dv);
      const th = Math.atan2(dv, du);
      const wave = Math.sin(r * 30 - t * 2.0 + th * 2);
      return Math.exp(-r * r * 4) * (0.5 + 0.5 * wave);
  }},
  { name: "shock", fn: (u, v, t) => {
      const r = Math.sqrt((u - 0.5) * (u - 0.5) + (v - 0.5) * (v - 0.5));
      const ph = (t * 0.5) % 1.1;             // anel fino, nítido, em loop
      return Math.exp(-Math.pow((r - ph * 0.8) * 22, 2));
  }},
  { name: "radar", fn: (u, v, t) => {
      const du = u - 0.5, dv = v - 0.5;
      const r = Math.sqrt(du * du + dv * dv);
      let th = Math.atan2(dv, du) - t * 0.8;  // feixe girando
      th = ((th % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      const beam = th > Math.PI ? 2 * Math.PI - th : th;
      const sweep = Math.exp(-beam * beam * 3);
      return Math.exp(-r * r * 3) * (0.15 + 0.85 * sweep);
  }},
];

/* ────────────────────────────────────────────────────────────
   SpectrumCanvas — versão refatorada (sem FFT/fake feedback).
   Mounta UMA vez, nunca remonta — animação persiste entre views.
   ──────────────────────────────────────────────────────────── */
const SHAPE_KEY  = "rustify-preview-shape";
const RENDER_KEY = "rustify-preview-renderer";
const NLINES  = 110;    // mesh: linhas horizontais
const NPOINTS = 96;     // mesh / contour: segmentos por linha
const NCOLS   = 90;     // columns: linhas verticais
const NROWS   = 110;    // columns: segmentos por coluna
const GX = 66, GY = 44; // dots: densidade da grade
const NBANDS  = 34;     // contour: bandas topográficas
const INK = "23, 23, 23";

/* ────────────────────────────────────────────────────────────
   Renderizadores — todos consomem o MESMO campo escalar
   shapeFn(u, v, t). Trocar de render nunca remonta o canvas.
   ──────────────────────────────────────────────────────────── */
function drawMesh(ctx, w, h, t, shapeFn, amp, breath, style) {
  const topY = h * 0.04, botY = h * 0.98;
  ctx.beginPath();
  for (let i = 0; i < NLINES; i++) {
    const v = i / (NLINES - 1);
    const baselineY = topY + (botY - topY) * v;
    for (let j = 0; j <= NPOINTS; j++) {
      const u = j / NPOINTS;
      const x = u * w;
      const s = shapeFn(u, v, t);
      const phase = i * 0.085 + t * 0.55;
      const wave  = Math.sin(u * Math.PI * 3.2 + phase) * s * amp;
      const drift = Math.sin(t * 0.45 + i * 0.07) * 1.4;
      const y = baselineY - wave + drift;
      if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
  }
  ctx.strokeStyle = style?.color ?? `rgba(${INK}, 0.16)`;
  ctx.lineWidth   = style?.width ?? 0.7;
  ctx.stroke();
}

function drawColumns(ctx, w, h, t, shapeFn, amp, breath, style) {
  const leftX = w * 0.02, rightX = w * 0.98;
  ctx.beginPath();
  for (let i = 0; i < NCOLS; i++) {
    const u = i / (NCOLS - 1);
    const baselineX = leftX + (rightX - leftX) * u;
    for (let j = 0; j <= NROWS; j++) {
      const v = j / NROWS;
      const y = h * 0.04 + h * 0.94 * v;
      const s = shapeFn(u, v, t);
      const phase = i * 0.085 + t * 0.55;
      const wave  = Math.sin(v * Math.PI * 3.2 + phase) * s * amp;
      const drift = Math.sin(t * 0.45 + i * 0.07) * 1.4;
      const x = baselineX - wave + drift;
      if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
  }
  ctx.strokeStyle = style?.color ?? `rgba(${INK}, 0.16)`;
  ctx.lineWidth   = style?.width ?? 0.7;
  ctx.stroke();
}

function drawWeave(ctx, w, h, t, shapeFn, amp, breath) {
  drawMesh(ctx, w, h, t, shapeFn, amp * 0.8, breath, { color: `rgba(${INK}, 0.10)`, width: 0.6 });
  drawColumns(ctx, w, h, t, shapeFn, amp * 0.8, breath, { color: `rgba(${INK}, 0.10)`, width: 0.6 });
}

function drawDots(ctx, w, h, t, shapeFn, amp, breath) {
  const maxR = Math.min(w / GX, h / GY) * 0.66;
  ctx.fillStyle = `rgb(${INK})`;
  for (let gy = 0; gy < GY; gy++) {
    const v = gy / (GY - 1);
    const y = h * 0.04 + h * 0.94 * v;
    for (let gx = 0; gx < GX; gx++) {
      const u = gx / (GX - 1);
      const s = shapeFn(u, v, t);
      if (s < 0.03) continue;
      const cl = Math.min(1, s);
      const r = maxR * cl * (0.55 + 0.45 * breath);
      const x = u * w + Math.sin(t * 0.6 + gy * 0.3) * 1.2;
      ctx.globalAlpha = 0.10 + 0.55 * cl;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawContour(ctx, w, h, t, shapeFn, amp, breath) {
  const topY = h * 0.04, botY = h * 0.98;
  for (let i = 0; i < NBANDS; i++) {
    const v = i / (NBANDS - 1);
    const baselineY = topY + (botY - topY) * v;
    let peak = 0;
    ctx.beginPath();
    for (let j = 0; j <= NPOINTS; j++) {
      const u = j / NPOINTS;
      const x = u * w;
      const s = shapeFn(u, v, t);
      if (s > peak) peak = s;
      const wave = Math.sin(u * Math.PI * 3.2 + t * 0.55) * s * amp * 1.5;
      const y = baselineY - wave;
      if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `rgba(${INK}, ${0.05 + 0.32 * peak})`;
    ctx.lineWidth   = 0.6 + 1.6 * peak;
    ctx.stroke();
  }
}

const RENDERERS = [
  { name: "mesh",    fn: drawMesh },
  { name: "columns", fn: drawColumns },
  { name: "weave",   fn: drawWeave },
  { name: "dots",    fn: drawDots },
  { name: "contour", fn: drawContour },
];

let shapeIdx = (() => {
  const raw = parseInt(localStorage.getItem(SHAPE_KEY) ?? "0", 10);
  return Number.isFinite(raw) ? ((raw % SHAPES.length) + SHAPES.length) % SHAPES.length : 0;
})();
let renderIdx = (() => {
  const raw = parseInt(localStorage.getItem(RENDER_KEY) ?? "0", 10);
  return Number.isFinite(raw) ? ((raw % RENDERERS.length) + RENDERERS.length) % RENDERERS.length : 0;
})();
let mountCount = 0;
let frameCount = 0;

function setShape(n) {
  shapeIdx = ((n % SHAPES.length) + SHAPES.length) % SHAPES.length;
  try { localStorage.setItem(SHAPE_KEY, String(shapeIdx)); } catch {}
  document.getElementById("hudShape").textContent = SHAPES[shapeIdx].name;
  const nameEl = document.getElementById("shapeName");
  if (nameEl) nameEl.innerHTML = `shape · <b>${SHAPES[shapeIdx].name}</b>`;
}

function setRenderer(n) {
  renderIdx = ((n % RENDERERS.length) + RENDERERS.length) % RENDERERS.length;
  try { localStorage.setItem(RENDER_KEY, String(renderIdx)); } catch {}
  const hud = document.getElementById("hudRender");
  if (hud) hud.textContent = RENDERERS[renderIdx].name;
  const nameEl = document.getElementById("renderName");
  if (nameEl) nameEl.innerHTML = `render · <b>${RENDERERS[renderIdx].name}</b>`;
}

function startSpectrumCanvas() {
  mountCount++;
  document.getElementById("hudMounts").textContent = String(mountCount);

  const canvas = document.getElementById("bgCanvas");
  const ctx = canvas.getContext("2d");
  const t0 = performance.now();
  let w = 0, h = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    w = Math.max(1, r.width);
    h = Math.max(1, r.height);
    canvas.width  = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const ro = new ResizeObserver(resize);
  ro.observe(canvas);
  resize();

  function frame() {
    requestAnimationFrame(frame);
    if (document.hidden || !canvas.isConnected) return;

    frameCount++;
    if (frameCount % 30 === 0) {
      document.getElementById("hudFrames").textContent = String(frameCount);
    }

    const t = (performance.now() - t0) * 0.001;
    ctx.clearRect(0, 0, w, h);

    // Único modulador de amplitude: respiração natural. Sem FFT,
    // sem kick, sem RMS, sem fakeKick/fakeEnergy.
    const breath = 0.85 + 0.15 * Math.sin(t * 0.4);
    const amp = h * 0.17 * breath;
    const shapeFn = SHAPES[shapeIdx].fn;

    // Despacha pro renderizador ativo. Só o índice muda entre eles.
    RENDERERS[renderIdx].fn(ctx, w, h, t, shapeFn, amp, breath);
  }
  requestAnimationFrame(frame);
}

/* ────────────────────────────────────────────────────────────
   Router minimalista — emula route() signal do Solid.
   ──────────────────────────────────────────────────────────── */
const VIEWS = {
  "/home":        renderHome,
  "/library":     renderLibrary,
  "/albums":      renderLibrary,
  "/queue":       renderLibrary,
  "/settings":    renderLibrary,
  "/now-playing": renderNowPlaying,
};

let currentRoute = "/home";

function navigate(path) {
  if (!(path in VIEWS)) path = "/home";
  currentRoute = path;
  window.location.hash = path;

  // Atualiza nav-item active
  document.querySelectorAll(".nav-item").forEach(el => {
    el.classList.toggle("active", el.dataset.route === path);
  });

  // Renderiza a view
  document.getElementById("main").innerHTML = "";
  VIEWS[path]();

  // ───── A REATIVIDADE QUE O USUÁRIO PEDIU PRA VER ─────
  // Apenas o data-mode do wrapper muda. O canvas não remonta.
  const mode = path === "/now-playing" ? "focused" : "ambient";
  document.getElementById("appBg").dataset.mode = mode;

  // HUD
  document.getElementById("routeLabel").textContent = path;
  document.getElementById("hudRoute").textContent = path;
  const modeEl = document.getElementById("hudMode");
  modeEl.textContent = mode;
  modeEl.classList.toggle("reactivity-hud__pill--focused", mode === "focused");
}

              return `
                <div class="card">
                  <div class="card__cover tone-${tones[i % tones.length]}"></div>
                  <p class="card__title">Album ${i+1}</p>
                  <p class="card__sub">Artist ${i+1}</p>
                </div>
              `;
            }).join("")}
          </div>
        </section>
      </div>
    </article>
  `;
}

function renderNowPlaying() {
  document.getElementById("main").innerHTML = `
    <article class="view" style="overflow: hidden; padding: 0;">
      <div class="np">
        <!-- O canvas NÃO vive mais aqui. É global no app-bg. -->
        <div class="np__chrome">
          <div class="np__left">
            <div class="np__cover">
              <span class="badge-fmt">FLAC · 44.1</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
            </div>
            <div class="np__meta">
              <div class="np__tags">
                <span class="np__tag-playing"><span class="dot"></span>Now Playing</span>
                <span class="np__tag-source"><b>Local</b> · PipeWire</span>
              </div>
              <h1 class="np__title">Northern Sky</h1>
              <p class="np__artist">Nick Drake</p>
              <p class="np__album">Bryter Layter · 1971</p>
              <div class="np__specs">
                <span><b>44.1</b> kHz</span>
                <span><b>16</b>-bit</span>
                <span>FLAC</span>
                <span>stereo</span>
              </div>
              <div class="np__specs np__specs--line2">
                <span>Sink <b>PipeWire</b></span>
                <span>DSP <b>OFF</b></span>
              </div>
            </div>
          </div>
        </div>
        <div class="np__viz-nav">
          <div class="np__nav-row">
            <button id="renderPrev" class="np__nav-btn" title="Previous renderer (,)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
            <span class="np__nav-name" id="renderName">render · <b>${RENDERERS[renderIdx].name}</b></span>
            <button id="renderNext" class="np__nav-btn" title="Next renderer (.)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
          </div>
          <div class="np__nav-row">
            <button id="shapePrev" class="np__nav-btn" title="Previous shape ([)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
            <span class="np__nav-name" id="shapeName">shape · <b>${SHAPES[shapeIdx].name}</b></span>
            <button id="shapeNext" class="np__nav-btn" title="Next shape (])"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
          </div>
        </div>
      </div>
    </article>
  `;
  document.getElementById("shapePrev").addEventListener("click", () => setShape(shapeIdx - 1));
  document.getElementById("shapeNext").addEventListener("click", () => setShape(shapeIdx + 1));
  document.getElementById("renderPrev").addEventListener("click", () => setRenderer(renderIdx - 1));
  document.getElementById("renderNext").addEventListener("click", () => setRenderer(renderIdx + 1));
}

/* ────────────────────────────────────────────────────────────
   Wire up
   ──────────────────────────────────────────────────────────── */
document.querySelectorAll(".nav-item[data-route]").forEach(el => {
  el.addEventListener("click", () => navigate(el.dataset.route));
});
window.addEventListener("keydown", (e) => {
  const tag = (e.target?.tagName ?? "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "n") { e.preventDefault(); navigate("/now-playing"); }
  else if (k === "h") { e.preventDefault(); navigate("/home"); }
  else if (k === "l") { e.preventDefault(); navigate("/library"); }
  else if (e.key === "[") { e.preventDefault(); setShape(shapeIdx - 1); }
  else if (e.key === "]") { e.preventDefault(); setShape(shapeIdx + 1); }
  else if (e.key === ",") { e.preventDefault(); setRenderer(renderIdx - 1); }
  else if (e.key === ".") { e.preventDefault(); setRenderer(renderIdx + 1); }
});

// Mount global canvas (UMA vez, antes da primeira view).
startSpectrumCanvas();

// Inicial route — pega do hash se houver, senão /home.
const initial = window.location.hash.replace(/^#/, "") || "/home";
navigate(initial);

// Sincroniza HUD + labels com o estado carregado do localStorage.
setShape(shapeIdx);
setRenderer(renderIdx);
</script>

</body>
</html>
